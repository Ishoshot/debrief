name: debrief

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: debrief
      POSTGRES_PASSWORD: debrief
      POSTGRES_DB: debrief
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debrief -d debrief"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://debrief:debrief@postgres:5432/debrief?sslmode=disable
      PORT: ${PORT:-8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  pgdata:
